[project]
name = "moldova-ai-lawyer"
version = "0.1.0"
description = "Asistent juridic AI local pentru legislația Republicii Moldova"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "pymupdf>=1.24",
    "snowballstemmer>=2.2",
    "python-multipart>=0.0.9",
    "psutil>=5.9",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
