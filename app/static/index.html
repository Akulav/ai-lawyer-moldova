<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b3a6f">
<meta name="application-name" content="Avocat AI Moldova">
<meta name="description" content="Asistent juridic AI local pentru legislația Republicii Moldova, cu trimiteri la surse.">
<title>Avocat AI Moldova</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230b3a6f'/%3E%3Cpath d='M16 6v20M9 26h14M7 10h18M7 10l-3 8a3 3 0 0 0 6 0zM25 10l-3 8a3 3 0 0 0 6 0z' stroke='%23e6c563' stroke-width='1.8' fill='none' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div class="app">
  <header class="topbar">
    <button class="menu-btn" id="menuBtn" aria-label="Meniu" aria-controls="rail" aria-expanded="false">☰</button>
    <a class="topbar-brand" href="#chat">Avocat AI</a>
    <span id="topStatus" class="top-status"></span>
  </header>
  <div class="scrim" id="scrim" hidden></div>
  <aside class="rail" id="rail">
    <a class="brand" href="#chat">
      <svg viewBox="0 0 32 32" width="30" height="30" aria-hidden="true"><rect width="32" height="32" rx="7" fill="#0b3a6f"/><path d="M16 6v20M9 26h14M7 10h18M7 10l-3 8a3 3 0 0 0 6 0zM25 10l-3 8a3 3 0 0 0 6 0z" stroke="#e6c563" stroke-width="1.8" fill="none" stroke-linejoin="round"/></svg>
      <span><b>Avocat AI</b><small>Republica Moldova</small></span>
    </a>
    <nav>
      <a href="#chat" data-nav="chat"><span class="ic">✦</span>Întreabă</a>
      <a href="#search" data-nav="search"><span class="ic">⌕</span>Caută în lege</a>
      <a href="#tree" data-nav="tree"><span class="ic">⑂</span>Arborele legislației</a>
      <a href="#index" data-nav="index"><span class="ic">▤</span>Index<em id="navIndex"></em></a>
      <a href="#problems" data-nav="problems"><span class="ic">⚠</span>Probleme<em id="navProblems"></em></a>
      <a href="#models" data-nav="models"><span class="ic">◈</span>Modele AI</a>
    </nav>
    <div class="convs">
      <div class="convs-head"><span>Discuții</span><button id="newChat" class="link">+ Nouă</button></div>
      <div id="convList"></div>
    </div>
    <div class="rail-foot">
      <div id="railStatus" class="status-mini"></div>
      <button class="link" id="themeBtn">Temă</button>
      <button class="link" id="aboutBtn">Avertisment legal</button>
    </div>
  </aside>
  <main id="main"></main>
</div>
<div id="modal" class="modal" hidden></div>
<div id="toast" class="toast" hidden></div>
<script src="/static/app.js"></script>
</body>
</html>
