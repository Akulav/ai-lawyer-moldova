[package]
name = "avocat-ai"
version = "1.0.0"
edition = "2021"
description = "Avocat AI Moldova: tray launcher that sets up and runs the local app"
publish = false

[[bin]]
name = "AvocatAI"
path = "src/main.rs"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true

[dependencies]
anyhow = "1.0.104"
include_dir = "0.7.4"
serde_json = "1.0.154"
tao = "0.37.2"
tray-icon = "0.26.1"
ureq = { version = "3.5.1", features = ["json"] }
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_Security", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell", "Win32_System_Diagnostics_ToolHelp"] }
zip = "9.2.3"

[build-dependencies]
embed-resource = "3.0.12"
